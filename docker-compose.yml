services:
  payment-producer:
    build: .
    image: payment-producer:latest
    env_file: .env            # KAFKA_BOOTSTRAP_SERVERS etc. (copier .env.example)
    restart: unless-stopped
    stop_grace_period: 30s    # laisse le temps de flush / commit des offsets
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
